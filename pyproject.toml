[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceable-rag-agent"
version = "0.2.0"
description = "A local-first, traceable Agentic RAG application with an embeddable REST API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "usearch>=2.26,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
ragagent = "ragagent.cli:main"
ragagent-worker = "ragagent.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
